# ADD(QA-rec-1): automated E2E in CI.
# The Playwright setup (playwright.config.js + tests/e2e) existed but was
# never wired to run automatically — this workflow boots the full stack
# (MongoDB service → seeded backend → built frontend preview) and runs the
# suites on every push/PR that touches code.
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Backend unit + integration suite (vitest, in-memory Mongo) — includes the
  # seed-audit contract test, so idempotency regressions fail here first.
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci
      - name: Run vitest suite
        working-directory: Backend
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            frontend/it-help-desk/package-lock.json

      # ---- Backend deps + env ------------------------------------------------
      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Write backend .env for CI
        working-directory: Backend
        run: |
          cat > .env <<'EOF'
          NODE_ENV=development
          PORT=5000
          DB_URL=mongodb://localhost:27017/jameel_it_e2e
          JWT_SECRET=ci_jwt_secret_please_generate_real_ones_in_prod
          JWT_REFRESH_SECRET=ci_refresh_secret_please_generate_real_ones
          CLIENT_URL=http://localhost:4173
          CORS_ORIGINS=http://localhost:4173
          EOF

      # ---- Frontend deps + Playwright browsers -------------------------------
      - name: Install frontend dependencies
        working-directory: frontend/it-help-desk
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend/it-help-desk
        run: npx playwright install --with-deps chromium

      # ---- Run the full stack E2E (seed → backend :5000 → preview :4173) ------
      - name: Run E2E suite
        working-directory: frontend/it-help-desk
        run: npm run test:e2e:full

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/it-help-desk/playwright-report/
          retention-days: 7

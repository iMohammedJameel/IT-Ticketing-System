# Production reverse-proxy nginx config.
# This is the SSL-terminating entry point — browsers hit this on port 443,
# nginx terminates TLS and forwards plain HTTP to the frontend container.
#
# Usage:
#   1. Place this file at /etc/nginx/sites-available/it-ticketing.conf
#   2. Replace "it-ticketing.example.com" with your real domain
#   3. Run: certbot --nginx -d it-ticketing.example.com
#   4. Symlink: ln -s /etc/nginx/sites-available/it-ticketing.conf /etc/nginx/sites-enabled/
#   5. Test: nginx -t  &&  systemctl reload nginx

# Rate limiting zone — protects against abuse on auth + API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

# Upstream: the frontend container (nginx serving the built SPA)
upstream it_ticketing_frontend {
    server 127.0.0.1:8080; # adjust to wherever docker exposes the frontend
    keepalive 32;
}

# Upstream: the backend container (Express + socket.io)
upstream it_ticketing_backend {
    server 127.0.0.1:5000; # adjust to wherever docker exposes the backend
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name it-ticketing.example.com;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name it-ticketing.example.com;

    # SSL certs (managed by certbot — auto-renewed)
    ssl_certificate     /etc/letsencrypt/live/it-ticketing.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-ticketing.example.com/privkey.pem;

    # Modern TLS config (Mozilla intermediate — supports older clients too)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS — tell browsers to only use HTTPS for the next 2 years
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP — restrict where scripts/styles/images can come from.
    # 'self' covers our own origin; connect-src also allows the WebSocket upgrade.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    # Allow large file uploads (matches backend 10 MB limit + headroom)
    client_max_body_size 12m;

    # Proxy /api → backend container (Express)
    # Rate-limited at 10 req/s per IP (the backend has its own rate limiter too)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://it_ticketing_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Stricter rate limit on auth endpoints (login, register, refresh, etc.)
    location ~ ^/api/auth/(login|register|refresh|forgot-password|reset-password|verify-email|resend-verification) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://it_ticketing_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /socket.io → backend (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://it_ticketing_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Everything else → frontend container (SPA + static assets)
    location / {
        proxy_pass http://it_ticketing_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Don't log health check noise
    location = /health {
        access_log off;
        proxy_pass http://it_ticketing_frontend;
    }
}
